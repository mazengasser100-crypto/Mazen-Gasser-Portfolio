<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Preloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== Global Reset ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ===== Self-Rotating Rocket Preloader Screen ===== */
        #space-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
        }

        .preloader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        /* Rocket Self-Spin Framework Box */
        .rocket-wrapper {
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* The SVG Rocket Structure */
        .self-rotating-rocket {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.6));
            transform-origin: center center;
            animation: spinAroundItself 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Micro-animation for the Engine Thrust */
        .rocket-flame {
            animation: enginePulse 0.1s ease-in-out infinite alternate;
            transform-origin: center top;
        }

        /* ===== Animation Keyframes ===== */
        @keyframes spinAroundItself {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes enginePulse {
            0% {
                transform: scaleY(0.85);
                opacity: 0.8;
            }
            100% {
                transform: scaleY(1.15);
                opacity: 1;
                filter: drop-shadow(0 0 4px #ff4d4d);
            }
        }

        /* Typography Glowing Waves */
        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 7px;
            color: #ffffff;
            display: flex;
            user-select: none;
        }

        .loading-text span {
            animation: waveGlow 1.4s ease-in-out infinite;
        }

        /* Sequential Stagger Delays for Letter Steps */
        .loading-text span:nth-child(1) { animation-delay: 0.0s; }
        .loading-text span:nth-child(2) { animation-delay: 0.1s; }
        .loading-text span:nth-child(3) { animation-delay: 0.2s; }
        .loading-text span:nth-child(4) { animation-delay: 0.3s; }
        .loading-text span:nth-child(5) { animation-delay: 0.4s; }
        .loading-text span:nth-child(6) { animation-delay: 0.5s; }
        .loading-text span:nth-child(7) { animation-delay: 0.6s; }

        @keyframes waveGlow {
            0%, 100% { 
                color: rgba(255, 255, 255, 0.3); 
                text-shadow: none; 
            }
            50% { 
                color: #00d4ff; 
                text-shadow: 0 0 10px #00d4ff, 0 0 20px rgba(0, 212, 255, 0.4); 
            }
        }

        /* Fade-out Exit State Utility Class */
        .preloader-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="space-preloader">
        <div class="preloader-content">
            <div class="rocket-wrapper">
                <svg class="self-rotating-rocket" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17 14C19 16 20 19 20 19H16.5L15 16.5L17 14Z" fill="#7c3aed" />
                    <path d="M7 14C5 16 4 19 4 19H7.5L9 16.5L7 14Z" fill="#7c3aed" />
                    <path d="M12 2C12 2 16 6 16 12C16 15.5 14.5 18 12 19C9.5 18 8 15.5 8 12C8 6 12 2 12 2Z" fill="#ffffff" />
                    <circle cx="12" cy="10" r="2" fill="#00d4ff" />
                    <path class="rocket-flame" d="M10 19.5C10 19.5 10.5 23 12 23C13.5 23 14 19.5 14 19.5H10Z" fill="#ff4d4d" />
                </svg>
            </div>
            
            <div class="loading-text">
                <span>L</span><span>O</span><span>A</span><span>D</span><span>I</span><span>N</span><span>G</span>
            </div>
        </div>
    </div>

    <script>
        // Smoothly hide preloader system when total visual components render
        window.addEventListener('load', () => {
            const preloader = document.getElementById('space-preloader');
            if (preloader) {
                setTimeout(() => {
                    preloader.classList.add('preloader-hidden');
                    const target=sessionStorage.getItem('loader_target_url') || 'index.html';
                    sessionStorage.removeItem('loader_target_url');
                    setTimeout(()=>window.location.replace(target),450);
                }, 1500); // 1.5 second display run-time safety buffer
            }
        });
    </script>
</body>
</html>
